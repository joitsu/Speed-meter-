<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width, initial-scale=1">
<title>GPS Speedometer</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px 15px;
  background: #07121e;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  color: #4ad7ff;
  letter-spacing: 3px;
}

.mittari {
  width: 260px;
  height: 260px;
  margin: 35px auto;
  border: 10px solid #268bba;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 35px #008cff55;
}

#nopeus {
  font-size: 85px;
  font-weight: bold;
}

.yksikko {
  color: #4ad7ff;
  font-size: 23px;
}

button {
  padding: 18px 25px;
  margin: 8px;
  border: none;
  border-radius: 12px;
  font-size: 17px;
  color: white;
  background: #008cff;
}

.stop {
  background: #c03949;
}

#status {
  color: #9fc5db;
  line-height: 1.6;
}
</style>
</head>

<body>

<h1>GPS SPEED</h1>
<p>REAL-TIME SPEEDOMETER</p>

<div class="mittari">
  <div id="nopeus">--</div>
  <div class="yksikko">KM/H</div>
</div>

<button onclick="aloita()">
  ALOITA GPS
</button>

<button class="stop" onclick="pysayta()">
  PYSÄYTÄ
</button>

<p id="status">GPS ei ole käynnissä.</p>
<p id="tarkkuus">Tarkkuus: --</p>
<p id="lahde">Nopeuden lähde: --</p>

<script>
let seuranta = null;
let edellinen = null;

const nopeusNaytto =
  document.getElementById("nopeus");

const status =
  document.getElementById("status");

function aloita() {

  if (!window.isSecureContext) {
    status.innerText =
      "GPS vaatii HTTPS-yhteyden tai localhostin.";
    return;
  }

  if (!navigator.geolocation) {
    status.innerText =
      "Selain ei tue paikannusta.";
    return;
  }

  if (seuranta !== null) return;

  status.innerText = "Etsitään GPS-signaalia...";

  seuranta = navigator.geolocation.watchPosition(
    paivitaNopeus,
    gpsVirhe,
    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 20000
    }
  );
}

function paivitaNopeus(position) {

  const coords = position.coords;
  let kmh = null;
  let lahde = "";

  if (coords.speed !== null &&
      coords.speed >= 0) {

    kmh = coords.speed * 3.6;
    lahde = "Puhelimen nopeustieto";

  } else if (edellinen !== null) {

    const aika =
      (position.timestamp -
       edellinen.timestamp) / 1000;

    if (aika > 0) {
      const matka = laskeMatka(
        edellinen.coords.latitude,
        edellinen.coords.longitude,
        coords.latitude,
        coords.longitude
      );

      kmh = (matka / aika) * 3.6;
      lahde = "Sijaintien välinen laskenta";
    }
  }

  if (kmh !== null) {
    nopeusNaytto.innerText =
      kmh.toFixed(1);
  }

  status.innerText =
    "GPS aktiivinen";

  document.getElementById("tarkkuus")
    .innerText =
    "Sijainnin tarkkuus: ±" +
    Math.round(coords.accuracy) + " m";

  document.getElementById("lahde")
    .innerText =
    "Nopeuden lähde: " + (lahde || "Odotetaan");

  edellinen = position;
}

function laskeMatka(lat1, lon1, lat2, lon2) {

  const R = 6371000;
  const rad = Math.PI / 180;

  const dLat = (lat2 - lat1) * rad;
  const dLon = (lon2 - lon1) * rad;

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * rad) *
    Math.cos(lat2 * rad) *
    Math.sin(dLon / 2) ** 2;

  return 2 * R *
    Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function gpsVirhe(error) {

  const viestit = {
    1: "Sijaintilupa evätty.",
    2: "Sijaintia ei saatavilla.",
    3: "GPS-yhteys aikakatkaistiin."
  };

  status.innerText =
    viestit[error.code] || error.message;
}

function pysayta() {

  if (seuranta !== null) {
    navigator.geolocation.clearWatch(seuranta);
    seuranta = null;
  }

  edellinen = null;
  nopeusNaytto.innerText = "--";
  status.innerText = "GPS pysäytetty.";
}
</script>

</body>
</html>
